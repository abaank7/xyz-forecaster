

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      # Prevents local node_modules from conflicting with the container
      - /app/node_modules 
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend